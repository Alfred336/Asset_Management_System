services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: asset-management-app
    container_name: asset-management-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - asset-network

  web:
    image: nginx:alpine
    container_name: asset-management-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - asset-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: asset-management-app
    container_name: asset-management-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:listen --tries=3
    volumes:
      - .:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - asset-network

networks:
  asset-network:
    driver: bridge
