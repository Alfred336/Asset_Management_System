[program:asset-management-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /home/kernel/Asset_Management_System/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
directory=/home/kernel/Asset_Management_System
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=kernel
numprocs=1
redirect_stderr=true
stdout_logfile=/home/kernel/Asset_Management_System/storage/logs/queue-worker.log
stopwaitsecs=3600

[program:asset-management-scheduler]
command=php /home/kernel/Asset_Management_System/artisan schedule:work
directory=/home/kernel/Asset_Management_System
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=kernel
numprocs=1
redirect_stderr=true
stdout_logfile=/home/kernel/Asset_Management_System/storage/logs/scheduler.log
stopwaitsecs=60
